<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020c16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><title>JARVIS 1.0</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 35%,#08344a 0%,#031523 38%,#01070d 80%);color:#d9faff;display:flex;align-items:center;justify-content:center}.panel{width:min(100%,480px);min-height:100dvh;padding:40px 24px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}header{font-size:12px;letter-spacing:.35em;color:#70d9ed}h1{font-size:34px;letter-spacing:.3em;margin:18px 0 0;text-shadow:0 0 20px #00cfff}.sub{font-size:11px;letter-spacing:.22em;color:#69b7c7}.core{position:relative;width:250px;height:250px;margin:48px auto 35px;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 0 20px #00b8e877)}.ring{position:absolute;inset:0;border:2px dashed #26d6ff;border-radius:50%;animation:spin 24s linear infinite;box-shadow:inset 0 0 35px #00d5ff22,0 0 25px #00cfff33}.ring.two{inset:22px;border:5px double #3ee4ff;animation-direction:reverse;animation-duration:15s}.ring.three{inset:46px;border:2px solid #6defff;animation-duration:9s}.center{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#d9ffff 0%,#70edff 16%,#0094ca 45%,#002c4b 75%);box-shadow:0 0 28px #00dfff,0 0 65px #00bfff66;animation:pulse 2.6s ease-in-out infinite}.listening .center{animation:pulse .65s ease-in-out infinite}.status{font-size:12px;letter-spacing:.17em;color:#71e8fa;min-height:18px}.response{margin:20px 0;min-height:76px;line-height:1.6;color:#e1fbff;max-width:360px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button{border:1px solid #29cdeb;background:#06283b;color:#dcfbff;padding:13px 17px;border-radius:12px;font-weight:700;cursor:pointer}button:active{transform:scale(.98)}button.primary{background:#008bb4}input{background:#041e2e;color:#fff;border:1px solid #278ba6;padding:13px;border-radius:10px;min-width:0;flex:1}.entry{display:flex;gap:8px;width:100%;margin-top:18px}.hint{font-size:12px;color:#79a9b8;margin-top:auto;padding-top:28px} @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.35)}}@media(prefers-reduced-motion:reduce){.ring,.center{animation:none}}
</style></head><body><main class="panel"><header>STARK INSPIRED INTERFACE</header><h1>J.A.R.V.I.S.</h1><div class="sub">PERSONAL ASSISTANT · VERSION 1.0</div><div class="core" id="core"><div class="ring"></div><div class="ring two"></div><div class="ring three"></div><div class="center"></div></div><div class="status" id="status">SISTEMI PRONTI</div><div class="response" id="response" aria-live="polite">Buongiorno. JARVIS è operativo.</div><div class="controls"><button class="primary" id="mic">🎙 PARLA</button><button id="greet">▶ AVVIA</button><button id="stop">■ STOP</button></div><form class="entry" id="form"><input id="command" aria-label="Comando" placeholder="Scrivi un comando..." autocomplete="off"><button type="submit">INVIA</button></form><div class="hint">Prova: “che ore sono”, “che giorno è”, “stato del sistema”, “chi sei”, “aiuto”.<br>La voce dipende dal supporto del browser.</div></main><script>
const $=id=>document.getElementById(id);let recognition;let active=false;
function speak(message){$('response').textContent=message;if(!('speechSynthesis' in window)){return;}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(message);utter.lang='it-IT';utter.rate=.94;utter.pitch=.82;speechSynthesis.speak(utter)}
function processCommand(raw){const s=raw.toLocaleLowerCase('it').trim();$('status').textContent='COMANDO ELABORATO';if(!s){speak('Non ho ricevuto alcun comando.');return;}if(/ore|orario/.test(s)){speak('Sono le '+new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit'}).format(new Date()));}else if(/giorno|data|oggi/.test(s)){speak('Oggi è '+new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()));}else if(/stato|sistemi|diagnostica/.test(s)){speak('Interfaccia operativa. Modulo vocale disponibile secondo il browser. Connessione al cervello artificiale non ancora configurata.');}else if(/chi sei|nome/.test(s)){speak('Sono JARVIS, il suo assistente personale sperimentale.');}else if(/ciao|buongiorno|salve/.test(s)){speak('Buongiorno, signore. Tutti i sistemi sono pronti.');}else if(/aiuto|comandi/.test(s)){speak('Può chiedermi l’ora, la data, lo stato del sistema oppure chi sono.');}else{speak('Comando ricevuto: '+raw+'. Questa funzione sarà disponibile in una prossima versione.');}}
$('form').addEventListener('submit',e=>{e.preventDefault();const t=$('command').value;$('command').value='';processCommand(t)});
$('greet').onclick=()=>{ $('status').textContent='SISTEMI PRONTI';speak('Buongiorno, signore. JARVIS è online e attende istruzioni.')};
$('stop').onclick=()=>{if(recognition&&active)recognition.stop();if('speechSynthesis'in window)speechSynthesis.cancel();$('core').classList.remove('listening');$('status').textContent='IN ATTESA'};
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{if(!SpeechRecognition){$('status').textContent='VOCE NON DISPONIBILE';$('response').textContent='Il riconoscimento vocale non è disponibile in questo browser. Usa il campo di testo oppure la dettatura della tastiera iPhone.';return;}if(active){recognition.stop();return;}recognition=new SpeechRecognition();recognition.lang='it-IT';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{active=true;$('core').classList.add('listening');$('status').textContent='IN ASCOLTO...'};recognition.onresult=e=>processCommand(e.results[0][0].transcript);recognition.onerror=e=>{$('response').textContent='Microfono: '+e.error+'. Verifica permessi, HTTPS e supporto del browser.'};recognition.onend=()=>{active=false;$('core').classList.remove('listening');$('status').textContent='SISTEMI PRONTI'};try{recognition.start()}catch(e){$('response').textContent='Impossibile avviare il microfono: '+e.message}};
</script></body></html>
