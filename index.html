<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020c16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><title>JARVIS 2.0 · Voce cinematografica</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 35%,#08344a 0%,#031523 38%,#01070d 80%);color:#d9faff;display:flex;align-items:center;justify-content:center}.panel{width:min(100%,480px);min-height:100dvh;padding:35px 20px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}header{font-size:11px;letter-spacing:.3em;color:#70d9ed}h1{font-size:33px;letter-spacing:.3em;margin:18px 0 0;text-shadow:0 0 20px #00cfff}.sub{font-size:11px;letter-spacing:.15em;color:#69b7c7}.core{position:relative;width:225px;height:225px;margin:35px auto 26px;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 0 20px #00b8e877)}.ring{position:absolute;inset:0;border:2px dashed #26d6ff;border-radius:50%;animation:spin 24s linear infinite;box-shadow:inset 0 0 35px #00d5ff22,0 0 25px #00cfff33}.ring.two{inset:22px;border:5px double #3ee4ff;animation-direction:reverse;animation-duration:15s}.ring.three{inset:46px;border:2px solid #6defff;animation-duration:9s}.center{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#d9ffff 0%,#70edff 16%,#0094ca 45%,#002c4b 75%);box-shadow:0 0 28px #00dfff,0 0 65px #00bfff66;animation:pulse 2.6s ease-in-out infinite}.listening .center{animation:pulse .65s ease-in-out infinite}.status{font-size:12px;letter-spacing:.13em;color:#71e8fa;min-height:20px}.response{margin:16px 0;min-height:66px;line-height:1.5;color:#e1fbff;max-width:360px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{border:1px solid #29cdeb;background:#06283b;color:#dcfbff;padding:12px 14px;border-radius:12px;font-weight:700;cursor:pointer}button.primary{background:#008bb4}input{background:#041e2e;color:#fff;border:1px solid #278ba6;padding:12px;border-radius:10px;min-width:0;flex:1}.entry{display:flex;gap:8px;width:100%;margin-top:16px}.settings{width:100%;margin-top:18px;padding:13px;border:1px solid #23657b;border-radius:12px;text-align:left;font-size:13px}.settings label{display:block;margin-bottom:8px}.settings input{width:100%;font-size:12px}.hint{font-size:12px;color:#79a9b8;margin-top:auto;padding-top:20px} @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.35)}}@media(prefers-reduced-motion:reduce){.ring,.center{animation:none}}
</style></head><body><main class="panel"><header>INTERFACCIA CINEMATOGRAFICA</header><h1>J.A.R.V.I.S.</h1><div class="sub">PERSONAL ASSISTANT · VERSION 2.0</div><div class="core" id="core"><div class="ring"></div><div class="ring two"></div><div class="ring three"></div><div class="center"></div></div><div class="status" id="status">SISTEMI PRONTI</div><div class="response" id="response" aria-live="polite">Buongiorno. JARVIS è operativo.</div><div class="controls"><button class="primary" id="mic">🎙 PARLA</button><button id="greet">▶ AVVIA</button><button id="test">🔊 TEST VOCE</button><button id="stop">■ STOP</button></div><form class="entry" id="form"><input id="command" aria-label="Comando" placeholder="Scrivi un comando..." autocomplete="off"><button type="submit">INVIA</button></form><section class="settings"><label for="endpoint">Indirizzo del servizio vocale AI (Cloudflare Worker)</label><input id="endpoint" type="url" placeholder="https://jarvis-voice.nome.workers.dev" autocomplete="off" spellcheck="false"><div style="display:flex;align-items:center;gap:8px;margin-top:10px"><button id="save" type="button">SALVA VOCE AI</button><span id="mode">Modalità: voce iPhone</span></div></section><div class="hint">Comandi: “ciao”, “chi sei”, “stato del sistema”, “aiuto”, “che ore sono”.<br>Voce AI per frasi predefinite; gli altri messaggi usano la voce del dispositivo.</div></main><script>
const $=id=>document.getElementById(id);let recognition=null,listening=false,audio=null,playToken=0,pending=null;
const phrases={hello:'Buongiorno, signore. JARVIS è online e attende istruzioni.',test:'Test audio completato. Sono JARVIS e la mia voce è operativa.',greeting:'Buongiorno, signore. Tutti i sistemi sono pronti.',identity:'Sono JARVIS, il suo assistente personale sperimentale.',status:'Interfaccia operativa. Modulo vocale online. Il cervello artificiale non è ancora collegato.',help:'Può chiedermi l’ora, la data, lo stato del sistema oppure chi sono.'};
const synth=window.speechSynthesis;let voices=[];function updateVoices(){if(synth)voices=synth.getVoices()}updateVoices();if(synth)synth.addEventListener('voiceschanged',updateVoices);
const endpointKey='jarvisVoiceEndpoint';$('endpoint').value=localStorage.getItem(endpointKey)||'';function endpoint(){return $('endpoint').value.trim().replace(/\/$/,'')};function mode(){ $('mode').textContent=endpoint()?'Modalità: voce AI + riserva iPhone':'Modalità: voce iPhone'}mode();
$('save').onclick=()=>{const u=endpoint();if(u && (!/^https:\/\/[a-z0-9.-]+\/[\w/-]*$/i.test(u)||new URL(u).username||new URL(u).password)){$('status').textContent='INSERISCI UN URL HTTPS VALIDO';return}localStorage.setItem(endpointKey,u);mode();$('status').textContent=u?'VOCE AI CONFIGURATA':'VOCE IPHONE ATTIVA'};
function stopAudio(){playToken++;if(audio){audio.pause();audio.src='';audio=null}if(synth)synth.cancel()}
function localSpeak(message){if(!synth||!window.SpeechSynthesisUtterance){$('status').textContent='VOCE LOCALE NON SUPPORTATA';return}updateVoices();synth.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='it-IT';u.rate=.89;u.pitch=.85;u.volume=1;u.voice=voices.find(v=>v.lang.toLowerCase()==='it-it')||voices.find(v=>v.lang.toLowerCase().startsWith('it'))||null;u.onstart=()=>{$('status').textContent='JARVIS STA PARLANDO (IPHONE)'};u.onend=()=>{$('status').textContent='SISTEMI PRONTI'};u.onerror=()=>{$('status').textContent='VOCE IPHONE NON DISPONIBILE'};synth.speak(u);if(synth.paused)synth.resume()}
async function speak(message,id){$('response').textContent=message;if(listening){pending={message,id};return}stopAudio();const token=playToken;const base=endpoint();if(!base||!id){localSpeak(message);return} $('status').textContent='GENERO VOCE CINEMATOGRAFICA...';try{const res=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phrase:id})});if(!res.ok)throw Error('HTTP '+res.status);const blob=await res.blob();if(token!==playToken)return;audio=new Audio(URL.createObjectURL(blob));audio.onended=()=>{$('status').textContent='SISTEMI PRONTI';URL.revokeObjectURL(audio.src)};audio.onerror=()=>{$('status').textContent='AUDIO AI NON RIPRODUCIBILE';localSpeak(message)};await audio.play();$('status').textContent='JARVIS STA PARLANDO (AI)'}catch(e){if(token!==playToken)return;$('status').textContent='VOCE AI NON DISPONIBILE: RIPROVO SU IPHONE';localSpeak(message)}}
function command(raw){const s=raw.toLocaleLowerCase('it').trim();if(!s){speak('Non ho ricevuto alcun comando.');return}if(/ore|orario/.test(s))speak('Sono le '+new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit'}).format(new Date()));else if(/giorno|data|oggi/.test(s))speak('Oggi è '+new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date()));else if(/stato|sistemi|diagnostica/.test(s))speak(phrases.status,'status');else if(/chi sei|nome/.test(s))speak(phrases.identity,'identity');else if(/ciao|buongiorno|salve/.test(s))speak(phrases.greeting,'greeting');else if(/aiuto|comandi/.test(s))speak(phrases.help,'help');else speak('Comando ricevuto: '+raw+'. Questa funzione sarà disponibile in una prossima versione.')}
$('greet').onclick=()=>speak(phrases.hello,'hello');$('test').onclick=()=>speak(phrases.test,'test');$('stop').onclick=()=>{if(recognition&&listening)recognition.stop();pending=null;stopAudio();$('core').classList.remove('listening');$('status').textContent='IN ATTESA'};$('form').onsubmit=e=>{e.preventDefault();const value=$('command').value;$('command').value='';command(value)};
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!Recognition){$('status').textContent='RICONOSCIMENTO NON SUPPORTATO';$('response').textContent='Usa la dettatura della tastiera iPhone.';return}if(listening){recognition.stop();return}stopAudio();recognition=new Recognition();recognition.lang='it-IT';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{listening=true;$('core').classList.add('listening');$('status').textContent='IN ASCOLTO...'};recognition.onresult=e=>command(e.results[0][0].transcript);recognition.onerror=e=>{$('response').textContent='Microfono: '+e.error};recognition.onend=()=>{listening=false;$('core').classList.remove('listening');$('status').textContent='SISTEMI PRONTI';if(pending){const p=pending;pending=null;setTimeout(()=>speak(p.message,p.id),250)}};try{recognition.start()}catch(e){$('status').textContent=e.message}};
</script></body></html>
