<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Diagnostica voce gratuita</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#071421;color:#e4f9ff;max-width:600px;margin:0 auto;padding:30px 18px}h1{color:#54e2ff}button{display:block;width:100%;padding:16px;margin:14px 0;background:#08688d;border:1px solid #54e2ff;border-radius:12px;color:white;font-size:18px}button:active{background:#03475e}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d2937;border:1px solid #246079;padding:15px;border-radius:10px;min-height:120px}p{line-height:1.5}
</style>
</head>
<body>
<h1>J.A.R.V.I.S.</h1>
<p>Diagnostica gratuita della voce su Safari iPhone. Tocca un pulsante per volta e alza il volume mentre la pagina prova a parlare.</p>
<button id="default">1 — Prova voce predefinita</button>
<button id="italian">2 — Prova voce italiana</button>
<button id="resume">3 — Riprendi voce sospesa</button>
<button id="stop">Ferma voce</button>
<p id="log" aria-live="polite">Pronto.</p>
<script>
(() => {
 const logEl=document.getElementById('log');
 const synth=window.speechSynthesis;
 let utterance=null;
 const log=s=>{logEl.textContent += '\n'+s;};
 if(!synth || !window.SpeechSynthesisUtterance){logEl.textContent='Sintesi vocale non supportata.';return;}
 const describe=()=>`Stato: speaking=${synth.speaking}, pending=${synth.pending}, paused=${synth.paused}`;
 const speak=(forceItalian)=>{
   synth.cancel();
   logEl.textContent='Avvio test...';
   utterance=new SpeechSynthesisUtterance('Buongiorno. Sono Jarvis. Questo è un test della voce.');
   utterance.lang='it-IT';
   utterance.rate=1;
   utterance.pitch=1;
   utterance.volume=1;
   if(forceItalian){
     const voices=synth.getVoices();
     const voice=voices.find(v=>v.lang.toLowerCase()==='it-it') || voices.find(v=>v.lang.toLowerCase().startsWith('it'));
     if(voice){utterance.voice=voice;log('Voce scelta: '+voice.name+' ('+voice.lang+')');}
     else log('Nessuna voce italiana disponibile: uso la predefinita.');
   }else log('Nessuna voce specifica impostata.');
   utterance.onstart=()=>log('Evento: inizio. '+describe());
   utterance.onend=()=>log('Evento: fine. '+describe());
   utterance.onerror=e=>log('Evento: errore '+e.error+'. '+describe());
   utterance.onpause=()=>log('Evento: pausa. '+describe());
   utterance.onresume=()=>log('Evento: ripresa. '+describe());
   synth.speak(utterance);
   log('Comando speak() inviato. '+describe());
 };
 document.getElementById('default').addEventListener('click',()=>speak(false));
 document.getElementById('italian').addEventListener('click',()=>speak(true));
 document.getElementById('resume').addEventListener('click',()=>{synth.resume();log('Comando resume(). '+describe());});
 document.getElementById('stop').addEventListener('click',()=>{synth.cancel();log('Comando cancel(). '+describe());});
 logEl.textContent='Voci disponibili: '+synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('it')).length+' italiane.\n'+describe();
})();
</script>
</body>
</html>
